name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-checks:
    name: Focused checks and local package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: macos-15
            bundle: dmg
          - os: macos-15-intel
            bundle: dmg
    runs-on: ${{ matrix.os }}
    # Approved exception for Intel cold toolchain/native compilation only.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 10 || 5 }}
    env:
      # CI packages are debug builds; symbols/incremental state only inflate compile and cache work.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target/.rustc_info.json
            desktop/target/debug/.fingerprint
            desktop/target/debug/build
            desktop/target/debug/deps/*.rlib
            desktop/target/debug/deps/*.rmeta
            desktop/target/debug/deps/*.dylib
            desktop/target/debug/deps/*.so
            desktop/target/debug/deps/*.d
          key: desktop-deps-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-debug0-noincremental-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: |
            desktop-deps-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-debug0-noincremental-
      - name: Linux native build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Pinned Rust tooling
        working-directory: desktop
        run: rustup show active-toolchain
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm --prefix desktop run check
      - run: npm --prefix desktop run build
      - name: Rust formatting, lints and generated transport
        working-directory: desktop
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo run -p workflow-engine --locked --bin export-types -- --check
      - name: All focused tests with one repository-wide 200-case gate
        run: node desktop/scripts/check-tests.mjs
      - run: npm run build
      - name: Compile and package bundled desktop assets (no launch or upload)
        working-directory: desktop
        run: npm exec -- tauri build --debug --bundles ${{ matrix.bundle }}
      - name: Advisory npm audits (once, outside dependency installation)
        if: runner.os == 'Linux'
        timeout-minutes: 1
        continue-on-error: true
        run: |
          set +e
          npm audit --fetch-timeout=10000 --fetch-retries=0
          root_status=$?
          npm audit --prefix desktop --fetch-timeout=10000 --fetch-retries=0
          desktop_status=$?
          test "$root_status" -eq 0 && test "$desktop_status" -eq 0
