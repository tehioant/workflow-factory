name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-checks:
    name: Focused checks and local package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: macos-15
            bundle: dmg
          - os: macos-15-intel
            bundle: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-${{ hashFiles('desktop/Cargo.lock') }}
      - name: Linux native build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Pinned Rust tooling
        working-directory: desktop
        run: rustup show active-toolchain
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix desktop --ignore-scripts
      - run: npm run typecheck
      - run: npm --prefix desktop run check
      - run: npm --prefix desktop run build
      - name: Rust formatting, lints and generated transport
        working-directory: desktop
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo run -p workflow-engine --locked --bin export-types -- --check
      - name: All focused tests with one repository-wide 200-case gate
        run: node desktop/scripts/check-tests.mjs
      - run: npm run build
      - name: Compile and package bundled desktop assets (no launch or upload)
        working-directory: desktop
        run: npm exec -- tauri build --debug --bundles ${{ matrix.bundle }}
