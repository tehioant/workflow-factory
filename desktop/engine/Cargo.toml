[package]
name = "workflow-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
ts-rs = "=12.0.1"
uuid = { version = "=1.18.1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
tempfile = "=3.23.0"
